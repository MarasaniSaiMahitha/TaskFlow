{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">

</head>


<body>


    <nav>

    <h1>TaskFlow</h1>


    <div class="nav-links">

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'completed' %}">
            Completed
        </a>

        <a href="{% url 'profile' %}">
            Profile
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </div>

</nav>




    <div class="dashboard-container">


    <h2>
        Edit Profile ✏️
    </h2>



    <form method="POST">


    {% csrf_token %}



    <label>
        First Name
    </label>

    <input 
    type="text"
    name="first_name"
    value="{{ request.user.first_name }}"
    >



    <label>
        Last Name
    </label>

    <input 
    type="text"
    name="last_name"
    value="{{ request.user.last_name }}"
    >



    <label>
        Email
    </label>

    <input 
    type="email"
    name="email"
    value="{{ request.user.email }}"
    >



    <button type="submit">
        Save Changes
    </button>



    </form>



    </div>



</body>

</html>
