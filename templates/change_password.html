{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password</title>

<link rel="stylesheet" href="{% static 'style.css' %}">

</head>


<body>


<nav>

    <h1>TaskFlow</h1>


    <div class="nav-links">

        <a href="{% url 'home' %}">
            Home
        </a>

        <a href="{% url 'dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'completed' %}">
            Completed
        </a>

        <a href="{% url 'profile' %}">
            Profile
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    </div>

</nav>



<div class="dashboard-container">


<h2>
Change Password 🔑
</h2>



<form method="POST">


{% csrf_token %}



<label>
Old Password
</label>

<input 
type="password"
name="old_password"
>



<label>
New Password
</label>

<input 
type="password"
name="new_password"
>



<label>
Confirm New Password
</label>

<input 
type="password"
name="confirm_password"
>



<button type="submit">
Change Password
</button>



</form>


</div>


</body>

</html>
